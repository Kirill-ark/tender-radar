<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 96px;
    box-sizing: border-box;
  }
  .tag { color: #58a6ff; font-size: 26px; font-weight: 600; letter-spacing: 0.04em; }
  h1 { font-size: 104px; margin: 12px 0 18px; letter-spacing: -0.02em; }
  .lead { font-size: 34px; color: #c9d1d9; line-height: 1.35; max-width: 1040px; }
  .flow { margin-top: 48px; display: flex; gap: 14px; align-items: center; font-size: 24px; color: #8b949e; }
  .pill { border: 1px solid #30363d; border-radius: 999px; padding: 8px 20px; color: #e6edf3; background: #161b22; }
  .arrow { color: #484f58; }
  .stats { margin-top: 40px; display: flex; gap: 48px; font-size: 24px; color: #8b949e; }
  .stats b { color: #3fb950; font-size: 30px; margin-right: 8px; }
</style>
</head>
<body>
  <div class="tag">n8n · RAG · LLM guardrails</div>
  <h1>Tender Radar</h1>
  <div class="lead">EU construction tenders, read for you every morning:<br>a card in Telegram, cited answers to your questions.</div>
  <div class="flow">
    <span class="pill">TED API</span><span class="arrow">→</span>
    <span class="pill">n8n</span><span class="arrow">→</span>
    <span class="pill">FastAPI · ChromaDB</span><span class="arrow">→</span>
    <span class="pill">Groq LLM</span><span class="arrow">→</span>
    <span class="pill">Telegram</span>
  </div>
  <div class="stats">
    <span><b>11/12</b>correct answers</span>
    <span><b>3/3</b>honest refusals</span>
    <span><b>~4 s</b>per tender</span>
  </div>
</body>
</html>
