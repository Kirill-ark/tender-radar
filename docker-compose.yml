services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - N8N_SECURE_COOKIE=false  # local only, lets Safari log in over http
      # Public HTTPS address of the tunnel: Telegram sends updates to it.
      # Set by scripts/start.sh, since a quick tunnel gets a new address each start.
      - WEBHOOK_URL=${WEBHOOK_URL:-}
    volumes:
      - n8n_data:/home/node/.n8n

  service:
    build: ./service
    env_file: .env  # GROQ_API_KEY
    ports:
      - "8000:8000"  # exposed for manual testing; n8n reaches it as http://service:8000
    volumes:
      - chroma_data:/data/chroma
      - ./data/metrics:/data/metrics  # metrics.sqlite, readable from the host
      - ./eval:/code/eval  # evaluation script and results, run inside the container

  tunnel:
    # Free Cloudflare quick tunnel: gives the local n8n a public HTTPS address,
    # so Telegram can deliver messages (webhooks) without hosting anything.
    image: cloudflare/cloudflared
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      - n8n

volumes:
  n8n_data:
  chroma_data:
