services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - N8N_SECURE_COOKIE=false  # local only, lets Safari log in over http
    volumes:
      - n8n_data:/home/node/.n8n

  service:
    build: ./service
    env_file: .env  # GROQ_API_KEY
    ports:
      - "8000:8000"  # exposed for manual testing; n8n reaches it as http://service:8000
    volumes:
      - chroma_data:/data/chroma

volumes:
  n8n_data:
  chroma_data:
